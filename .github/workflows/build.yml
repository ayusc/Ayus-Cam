name: Android CI Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.5.1'
          cache-read-only: false
          add-job-summary: 'always'

      - name: Build APK
        run: gradle assembleDebug --stacktrace --build-cache --parallel --configuration-cache

      - name: Sign APK
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out app/build/outputs/apk/debug/app-debug_signed.apk \
            "$UNSIGNED_APK"

      - name: Cleanup
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          git fetch --tags
          git tag | xargs -I {} git push origin :refs/tags/{} || true
          gh run list --workflow "${{ github.workflow }}" --json databaseId --limit 50 | \
          jq -r '.[].databaseId' | grep -v "${{ github.run_id }}" | \
          xargs -I {} gh run delete {} || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug_signed.apk
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
